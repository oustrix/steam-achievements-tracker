name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test SteamAchievements.Core.Tests --configuration Release --logger trx

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single file
        run: >
          dotnet publish SteamAchievements.Windows
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          --output publish
      - name: Verify the publish output really is a single file
        shell: pwsh
        run: |
          # -Recurse is load-bearing. Without it this step cannot see
          # subdirectories, and both the WebView2 loader and the BlazorWebView
          # static assets publish into subdirectories — so it would pass green
          # on an artifact that is not a single file at all.
          $files = Get-ChildItem publish -File -Recurse
          $files | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }
          if ($files.Count -ne 1) {
            throw "Expected exactly one published file, found $($files.Count). PublishSingleFile is not packing everything."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementsTracker-win-x64
          path: publish/
