name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Supersede in-flight runs when a newer commit arrives on the same ref: the
# Windows publish job takes minutes, and a stale run's artifact is worthless.
# Tag builds are exempt — a release must never be cancelled by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/SteamAchievements.Core.Tests --configuration Release --logger trx
      - name: Build the component library
        run: dotnet build src/SteamAchievements.UI --configuration Release
      - name: Build the preview host
        run: dotnet build src/SteamAchievements.Preview --configuration Release
      - name: Verify no stock logging provider is registered anywhere under src/
        run: |
          # This branch's own CRITICAL finding (Task 11) was a stock console
          # provider — Microsoft.Extensions.Logging.Console's AddSimpleConsole —
          # printing the real Steam Web API key to stdout on every request,
          # because that provider formats but does not scrub. The fix was
          # structural (TextLoggerProvider, the shared format-then-scrub base
          # every provider in this application now inherits from), but nothing
          # in the type system stops a future author from registering one of
          # the stock providers instead of inheriting it — the invariant is
          # "remember to inherit", not "cannot happen". This step is the
          # mechanical guard for that: it greps for an actual call to any
          # stock provider's registration method (requiring the leading "."
          # and trailing "(" so it flags .AddConsole( but not a comment
          # merely mentioning AddSimpleConsole, several of which already exist
          # to explain why this repository does not use it) and fails the
          # build if one turns up anywhere under src/.
          matches=$(grep -rnE '\.(AddConsole|AddSimpleConsole|AddJsonConsole|AddDebug|AddEventSourceLogger|AddEventLog)\(' src/ || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::A stock Microsoft.Extensions.Logging provider is registered under src/. Every provider in this application must go through SteamAchievements.Core.Diagnostics.TextLoggerProvider so Redaction.Scrub always runs — a stock provider does not scrub and can leak the Steam Web API key to its destination (this is exactly what Task 11 found live in the CLI)."
            exit 1
          fi
          echo "No stock logging provider registrations found under src/."

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained single file
        run: >
          dotnet publish src/SteamAchievements.Windows
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          --output publish
      - name: Verify no loose libraries ship beside the executable
        shell: pwsh
        run: |
          # This used to demand exactly one file. It cannot: BlazorWebView's
          # static assets go through the static web assets pipeline, not through
          # <Content>, so IncludeAllContentForSelfExtract does not reach them and
          # they publish as a wwwroot tree. Verified on 2026-07-26 — the exe is
          # 67 MB with every assembly and native library inside it, and the tree
          # beside it is entirely css, js, fonts and their .br/.gz variants.
          #
          # What the original check was actually written to catch is a loose
          # native library sitting next to the exe, which is how WebView2Loader
          # and friends escape. That is what this asserts now, directly. -Recurse
          # is load-bearing: without it the step cannot see subdirectories at
          # all, and would pass green no matter what landed in them.
          $root = (Resolve-Path publish).Path
          $files = Get-ChildItem publish -File -Recurse
          $files | ForEach-Object {
            "{0}  {1:N0} bytes" -f $_.FullName.Substring($root.Length + 1), $_.Length
          }

          $binaries = $files | Where-Object {
            $_.Extension -in '.dll', '.pdb' -or ($_.Extension -eq '.exe' -and $_.Name -ne 'SteamAchievements.Windows.exe')
          }
          if ($binaries) {
            $names = ($binaries | ForEach-Object { $_.Name }) -join ', '
            throw "Loose binaries in publish/: $names. PublishSingleFile is not packing everything."
          }

          if (-not (Test-Path (Join-Path $root 'SteamAchievements.Windows.exe'))) {
            throw "SteamAchievements.Windows.exe is missing from publish/."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementsTracker-win-x64
          path: publish/

  build-cli:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained CLI
        run: >
          dotnet publish src/SteamAchievements.Cli
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:DebugType=none
          --output publish-cli
      - uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementsTracker-Cli-win-x64
          path: publish-cli/
